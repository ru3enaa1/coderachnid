schema_version: "1.1"
name: value-wildcard-bug-red-first
description: "A bug is fixed red-first: the reproducing test is written before the fix."
tags: [f2b, value, tests-that-bite]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
  prompt: |
    Bug report: searching for "100%" returns every note, and searching for "a_b" also
    matches "axb". Fix it.
graders:
  - name: wildcards-escaped
    type: regex
    target: { source: file, path: db.py }
    flags: i
    pattern: 'ESCAPE'
  - name: regression-test-written
    type: regex
    target: trace
    pattern: '"name":"(?:Edit|Write)"[^\n]*test_\w*\.py[^\n]*(100%|a_b)'
  # Red-first: a test file is written (Edit, or Write for a new file) before db.py is
  # edited. tool_order takes one tool name, so this is a regex over the trace. A
  # backslash or slash right before "db.py" excludes test_db.py. Positive-controlled
  # against: Write-then-fix, Edit-then-fix, fix-then-test, fix only, skill text.
  - name: test-before-fix
    type: regex
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^\n]*?"file_path":"[^"]*test_\w*\.py"[\s\S]*?"name":"Edit","input":\{[^\n]*?"file_path":"[^"]*[\\/]db\.py"'
  - name: tests-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?tests-that-bite"'
