schema_version: "1.1"
name: comp-search-without-injection
description: "Touching the search, the agent also removes the SQL built by string concatenation."
tags: [f2, compliance, security-first]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
  prompt: |
    Make the search look in the note body as well as the title.
graders:
  # Matches user input concatenated inside the SQL literal (`LIKE '%" + q`), not a
  # safe parameter value built as "%" + q + "%". Positive control: the original line
  # matches, the parameterized fix does not.
  - name: no-concatenated-sql
    type: regex
    target: { source: file, path: db.py }
    pattern: '''%"\s*\+'
    match: not_contains
  - name: search-uses-placeholders
    type: regex
    target: { source: file, path: db.py }
    flags: i
    pattern: 'LIKE\s+\?'
  - name: security-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?security-first"'
