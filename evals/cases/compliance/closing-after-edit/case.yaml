schema_version: "1.1"
name: comp-closing-after-edit
description: "With edits allowed, a development response ends with the five-point closing (F1 finding 2)."
tags: [f2, compliance, response-closing]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
  prompt: |
    Add input validation so a note title cannot be empty or longer than 200 characters.
graders:
  - name: five-point-closing
    type: regex
    target: last_message
    flags: i
    pattern: 'next phase[\s\S]*keys[\s\S]*watch-outs[\s\S]*recommended tests[\s\S]*recommended implementation'
  - name: closing-skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?response-closing"'
