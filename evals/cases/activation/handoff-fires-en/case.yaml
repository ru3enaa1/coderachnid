schema_version: "1.1"
name: act-handoff-fires-en
description: "handoff should activate when the user wants to continue in a fresh session (v0.5.0)."
tags: [f5, activation, handoff, en]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    This conversation is getting long. Save where we are so I can start a fresh chat and
    keep going without explaining everything again.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?handoff"'
