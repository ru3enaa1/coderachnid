schema_version: "1.1"
name: act-project-setup-fires-es
description: "project-setup should activate (es phrasing)."
tags: [f2, activation, project-setup, es]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Quiero dejar este proyecto bien armado desde el inicio: reglas para el agente, plan de desarrollo y registro de decisiones.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?project-setup"'
