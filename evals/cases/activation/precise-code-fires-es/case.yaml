schema_version: "1.1"
name: act-precise-code-fires-es
description: "precise-code should activate (es phrasing)."
tags: [f2, activation, precise-code, es]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Refactoriza search_notes para que reciba también un límite de resultados.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?precise-code"'
