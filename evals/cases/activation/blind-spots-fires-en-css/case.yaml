schema_version: "1.1"
name: act-blind-spots-fires-en-css
description: "blind-spots should activate before a CSS fix (v0.2.1)."
tags: [f5, activation, blind-spots, en]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    On a phone, the footer in static/site.css covers the "New note" button. Fix the CSS.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?blind-spots"'
