schema_version: "1.1"
name: act-safe-database-fires-es
description: "safe-database should activate (es phrasing)."
tags: [f2, activation, safe-database, es]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Necesito agregar una columna de prioridad a la tabla de notas.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?safe-database"'
