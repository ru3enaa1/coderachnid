schema_version: "1.1"
name: act-security-first-fires-en-edit
description: "security-first should activate on a small edit endpoint (English twin of the Spanish case, to tell language from risk perception)."
tags: [f2, activation, security-first, en]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Add an endpoint to edit a note's title by its id.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?security-first"'
