schema_version: "1.1"
name: act-safe-database-fires-en
description: "safe-database should activate (en phrasing)."
tags: [f2, activation, safe-database, en]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Rename the body column of the notes table to content.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?safe-database"'
