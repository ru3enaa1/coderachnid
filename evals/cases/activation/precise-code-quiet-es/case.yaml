schema_version: "1.1"
name: act-precise-code-quiet-es
description: "precise-code should not activate (es phrasing)."
tags: [f2, activation, precise-code, es]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    ¿Qué diferencia hay entre los códigos HTTP 401 y 403?
graders:
  - name: skill-stays-quiet
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?precise-code"'
    min: 0
    max: 0
    arm: both
