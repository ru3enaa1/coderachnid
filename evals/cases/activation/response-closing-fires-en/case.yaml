schema_version: "1.1"
name: act-response-closing-fires-en
description: "response-closing should activate (en phrasing)."
tags: [f2, activation, response-closing, en]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Add a GET /notes/<id> endpoint that returns a single note.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?response-closing"'
