schema_version: "1.1"
name: act-blind-spots-quiet-es
description: "blind-spots should not activate (es phrasing)."
tags: [f2, activation, blind-spots, es]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    ¿Qué licencia de código abierto me recomiendas para un proyecto pequeño?
graders:
  - name: skill-stays-quiet
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?blind-spots"'
    min: 0
    max: 0
    arm: both
