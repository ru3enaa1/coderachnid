schema_version: "1.1"
name: act-handoff-quiet-es
description: "handoff should not activate on an ordinary question about the code (v0.5.0)."
tags: [f5, activation, handoff, es]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Explica en una frase qué hace la función search_notes de db.py.
graders:
  - name: skill-stays-quiet
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?handoff"'
    min: 0
    max: 0
    arm: both
