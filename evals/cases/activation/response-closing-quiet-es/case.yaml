schema_version: "1.1"
name: act-response-closing-quiet-es
description: "response-closing should not activate (es phrasing)."
tags: [f2, activation, response-closing, es]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    En una frase, ¿qué es SQLite?
graders:
  - name: skill-stays-quiet
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?response-closing"'
    min: 0
    max: 0
    arm: both
