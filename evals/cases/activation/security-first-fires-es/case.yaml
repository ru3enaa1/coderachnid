schema_version: "1.1"
name: act-security-first-fires-es
description: "security-first should activate (es phrasing)."
tags: [f2, activation, security-first, es]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Agrega un endpoint para editar el título de una nota por su id.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?security-first"'
