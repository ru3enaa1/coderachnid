schema_version: "1.1"
name: act-blind-spots-quiet-en
description: "blind-spots should not activate on a general question, even after its description was widened (v0.2.1)."
tags: [f5, activation, blind-spots, en]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    In two sentences, what is a Python list comprehension?
graders:
  - name: skill-stays-quiet
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?blind-spots"'
    min: 0
    max: 0
    arm: both
