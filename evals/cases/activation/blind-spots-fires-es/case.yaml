schema_version: "1.1"
name: act-blind-spots-fires-es
description: "blind-spots should activate (es phrasing)."
tags: [f2, activation, blind-spots, es]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Ya terminé la validación de títulos. ¿Lo damos por hecho y cerramos?
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?blind-spots"'
