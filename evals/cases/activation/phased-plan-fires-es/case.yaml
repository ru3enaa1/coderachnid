schema_version: "1.1"
name: act-phased-plan-fires-es
description: "phased-plan should activate (es phrasing)."
tags: [f2, activation, phased-plan, es]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Arma un plan por fases para agregar usuarios, etiquetas y exportación a CSV.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?phased-plan"'
