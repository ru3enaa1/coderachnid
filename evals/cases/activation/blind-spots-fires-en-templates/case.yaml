schema_version: "1.1"
name: act-blind-spots-fires-en-templates
description: "blind-spots should activate when reviewing a server template, not only when declaring work done (v0.2.1)."
tags: [f5, activation, blind-spots, en]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Review the Thymeleaf template templates/notes.html and tell me if anything will
    break when it renders. Don't edit anything.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?blind-spots"'
