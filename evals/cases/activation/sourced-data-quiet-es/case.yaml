schema_version: "1.1"
name: act-sourced-data-quiet-es
description: "sourced-data should not activate on an ordinary code change (v0.3.0)."
tags: [f5, activation, sourced-data, es]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Agrega un docstring a la función list_notes de db.py.
graders:
  - name: skill-stays-quiet
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?sourced-data"'
    min: 0
    max: 0
    arm: both
