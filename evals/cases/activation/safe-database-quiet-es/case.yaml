schema_version: "1.1"
name: act-safe-database-quiet-es
description: "safe-database should not activate (es phrasing)."
tags: [f2, activation, safe-database, es]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Cambia el mensaje de error 404 por "nota no encontrada".
graders:
  - name: skill-stays-quiet
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?safe-database"'
    min: 0
    max: 0
    arm: both
