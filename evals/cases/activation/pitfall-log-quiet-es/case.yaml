schema_version: "1.1"
name: act-pitfall-log-quiet-es
description: "pitfall-log should not activate (es phrasing)."
tags: [f2, activation, pitfall-log, es]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Agrega un campo updated_at a la respuesta JSON.
graders:
  - name: skill-stays-quiet
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?pitfall-log"'
    min: 0
    max: 0
    arm: both
