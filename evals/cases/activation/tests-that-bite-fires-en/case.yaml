schema_version: "1.1"
name: act-tests-that-bite-fires-en
description: "tests-that-bite should activate (en phrasing)."
tags: [f2, activation, tests-that-bite, en]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    The search endpoint has no tests. Cover it.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?tests-that-bite"'
