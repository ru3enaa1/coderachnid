schema_version: "1.1"
name: act-blind-spots-fires-en-pdf
description: "blind-spots should activate before generating a PDF document from a template (v0.4.0)."
tags: [f5, activation, blind-spots, en]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Add a PDF export of the notes page, rendered from templates/notes.html.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?blind-spots"'
