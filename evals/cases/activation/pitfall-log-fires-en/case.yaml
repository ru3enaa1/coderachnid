schema_version: "1.1"
name: act-pitfall-log-fires-en
description: "pitfall-log should activate (en phrasing)."
tags: [f2, activation, pitfall-log, en]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Weird: the search test passes alone but fails when the whole suite runs. I've already tried to fix it twice. Figure out why.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?pitfall-log"'
