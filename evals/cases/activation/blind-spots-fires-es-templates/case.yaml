schema_version: "1.1"
name: act-blind-spots-fires-es-templates
description: "blind-spots should activate when reviewing a server template, Spanish phrasing (v0.2.1)."
tags: [f5, activation, blind-spots, es]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Revisa la plantilla Thymeleaf templates/notes.html y dime si algo puede fallar al
    renderizarla. No edites nada.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?blind-spots"'
