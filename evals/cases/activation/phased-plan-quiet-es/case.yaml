schema_version: "1.1"
name: act-phased-plan-quiet-es
description: "phased-plan should not activate (es phrasing)."
tags: [f2, activation, phased-plan, es]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Corrige la falta de ortografía "recieve" en el README.
graders:
  - name: skill-stays-quiet
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?phased-plan"'
    min: 0
    max: 0
    arm: both
