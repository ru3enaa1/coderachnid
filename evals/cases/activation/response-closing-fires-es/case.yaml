schema_version: "1.1"
name: act-response-closing-fires-es
description: "response-closing should activate (es phrasing)."
tags: [f2, activation, response-closing, es]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Agrega un endpoint que devuelva una sola nota por su id.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?response-closing"'
