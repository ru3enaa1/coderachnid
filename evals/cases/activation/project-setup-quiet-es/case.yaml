schema_version: "1.1"
name: act-project-setup-quiet-es
description: "project-setup should not activate (es phrasing)."
tags: [f2, activation, project-setup, es]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Corre las pruebas y dime el resultado.
graders:
  - name: skill-stays-quiet
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?project-setup"'
    min: 0
    max: 0
    arm: both
