schema_version: "1.1"
name: act-security-first-fires-en
description: "security-first should activate (en phrasing)."
tags: [f2, activation, security-first, en]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Let users upload a text file and turn each line into a note.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?security-first"'
