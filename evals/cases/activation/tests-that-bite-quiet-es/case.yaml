schema_version: "1.1"
name: act-tests-that-bite-quiet-es
description: "tests-that-bite should not activate (es phrasing)."
tags: [f2, activation, tests-that-bite, es]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Cambia el README para que diga que la API responde en JSON.
graders:
  - name: skill-stays-quiet
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?tests-that-bite"'
    min: 0
    max: 0
    arm: both
