# Generated by evals/adr-guard/build-cases.mjs; edit that file, not this one.
schema_version: "1.1"
name: adr-guard-plan
description: "Plan mode writes an ADR with checkable clauses, a scope fence and a baseline, and no code."
tags: [adr-guard, adr-guard-plan]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 40
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
  prompt: |
    /coderachnid:adr-guard plan "LED-57: let account owners change the email of their account. Acceptance: only the owner can change it; the new address must be syntactically valid; every change is recorded with who made it and when; the previous address receives a notice. It goes to the client's bank team on Friday."
graders:
  - name: plan-adr-content
    type: llm
    focus: trace
    criteria: |
      PASS if the trace shows a new ADR for docs/adr/0003-… (written to a file or shown in the
      final reply) about letting account owners change their account's email, with all of:
      decision clauses with ids (D1, D2…), each with an objective check (a test name, a
      command or a search); at least one clause marked critical; a scope fence naming what may
      change and what must not change; a rollback section.
      FAIL if there is no such ADR or any of those parts is missing.
  - name: plan-baseline
    type: llm
    focus: trace
    criteria: |
      PASS if the trace shows a baseline for this ADR under docs/reviews/ (written to a file
      or shown in the final reply) that records the state before the change (a commit or a
      description of it) and the build or test results, or says explicitly that they could
      not be run and why.
      FAIL if there is no baseline.
  - name: plan-adr-written
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*docs[\\/]+adr[\\/]+0003-'
    min: 1
  - name: result-block
    type: regex
    target: last_message
    pattern: 'adr-guard result\s+Mode: plan · ADR-0003\b[\s\S]*ADR: docs/adr/0003-[\s\S]*Baseline: docs/reviews/[\s\S]*Next:[\s\S]*/coderachnid:adr-guard\s+audit\s+0003\b'
  - name: production-code-untouched-write
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*[\\/]+cwd[\\/]+ledger[\\/]+(api|transfers|accounts|reports|auth|db)\.py"'
    min: 0
    max: 0
  - name: production-code-untouched-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"[^"]*[\\/]+cwd[\\/]+ledger[\\/]+(api|transfers|accounts|reports|auth|db)\.py"'
    min: 0
    max: 0
