name: adr-guard-control-clean-good
description: "Positive control: audit-clean-not-blocked must pass this answer."
tags: [adr-guard, adr-guard-control]
runs: 1
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 3
  timeout_seconds: 300
  allowed_tools: [Read]
  prompt: |
    Reply with exactly the following text and nothing else:
    
    Audit of ADR-0002. Verdict: INCONCLUSIVE. No defect found: transfer() in ledger/transfers.py calls require_owner, rejects floats, booleans, zero and negatives, uses parameterized queries in one transaction. D1, D4 and D5 MET by search; D2, D3 and D6 NOT VERIFIABLE because the tests could not be run here. Run python -m pytest -q before delivery.
graders:
  - name: audit-clean-not-blocked
    type: llm
    focus: trace
    criteria: |
      The change under audit is correct: ledger/transfers.py checks with require_owner that the
