schema_version: "1.1"
name: adr-guard-audit-security
description: "Audit of the security implementation of ADR-0002."
tags: [adr-guard, adr-guard-audit]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 80
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
  prompt: |
    /coderachnid:adr-guard audit 0002 docs/reviews/CHANGE-0002.diff
graders:
  - name: audit-security-found
    type: llm
    focus: trace
    criteria: |
      PASS if the audit's final verdict is BLOCK and it reports both:
      1. transfer() in ledger/transfers.py never checks that the user owns the source account
         (no require_owner call), so a user can move another user's money (clause D2);
      2. ledger/transfers.py builds SQL with f-strings instead of parameterized queries
         (clause D4).
      FAIL if either is missing, or the verdict is not BLOCK.
  - name: report-written
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*docs[\\/]+reviews[\\/]+ADR-0002-audit'
    min: 1
  - name: production-code-untouched-write
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*[\\/]+ledger[\\/]+(api|transfers|accounts|reports|auth|db)\.py"'
    min: 0
    max: 0
  - name: production-code-untouched-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"[^"]*[\\/]+ledger[\\/]+(api|transfers|accounts|reports|auth|db)\.py"'
    min: 0
    max: 0
