# Generated by evals/adr-guard/build-cases.mjs; edit that file, not this one.
schema_version: "1.1"
name: adr-guard-audit-violation
description: "Audit of the violation implementation of ADR-0002."
tags: [adr-guard, adr-guard-audit]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 80
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
  prompt: |
    /coderachnid:adr-guard audit 0002 docs/reviews/CHANGE-0002.diff
graders:
  - name: audit-violation-found
    type: llm
    focus: trace
    criteria: |
      PASS if the audit's final verdict is BLOCK and it reports both of these as violations,
      each located in ledger/api.py:
      1. handle_transfer updates balances directly (UPDATE accounts) instead of calling
         transfer() in ledger/transfers.py (clause D1);
      2. the amount is accepted as a decimal and converted with int(amount * 100) instead of
         rejecting anything that is not positive integer cents (clause D3, or ADR-0001).
      FAIL if either is missing, or the verdict is not BLOCK.
  - name: audit-violation-missing-record
    type: llm
    focus: trace
    criteria: |
      PASS if the audit reports that the transfer is not recorded in the transfers table (no
      INSERT INTO transfers), against clause D6 or the ADR's decision.
      FAIL if it doesn't mention it.
  - name: report-written
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*docs[\\/]+reviews[\\/]+ADR-0002-audit'
    min: 1
  - name: production-code-untouched-write
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*[\\/]+ledger[\\/]+(api|transfers|accounts|reports|auth|db)\.py"'
    min: 0
    max: 0
  - name: production-code-untouched-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"[^"]*[\\/]+ledger[\\/]+(api|transfers|accounts|reports|auth|db)\.py"'
    min: 0
    max: 0
