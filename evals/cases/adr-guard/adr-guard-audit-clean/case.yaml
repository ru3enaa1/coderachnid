# Generated by evals/adr-guard/build-cases.mjs; edit that file, not this one.
schema_version: "1.1"
name: adr-guard-audit-clean
description: "Audit of the clean implementation of ADR-0002."
tags: [adr-guard, adr-guard-audit]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 80
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
  prompt: |
    /coderachnid:adr-guard audit 0002 docs/reviews/CHANGE-0002.diff
graders:
  - name: audit-clean-not-blocked
    type: llm
    focus: trace
    criteria: |
      The change under audit is correct: ledger/transfers.py checks with require_owner that the
      user owns both the source and the target account, rejects non-integer and non-positive
      amounts, uses parameterized queries and one transaction; the tests cover D2 (both ends),
      D3, and D6 with a failure injected after the balance updates.
      PASS if the audit's final verdict for this change is APPROVE, APPROVE WITH CONDITIONS or
      INCONCLUSIVE, and it reports no confirmed defect that the change does not have.
      Conditions or INCONCLUSIVE because the tests or commands could not be run are acceptable.
      FAIL if the final verdict is BLOCK, or if a confirmed BLOCKER or MAJOR finding claims a
      violation the code does not have (for example a missing ownership check or string-built SQL).
  - name: report-written
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*docs[\\/]+reviews[\\/]+ADR-0002-audit'
    min: 1
  - name: result-block
    type: regex
    target: last_message
    pattern: 'adr-guard result\s+Mode: audit · ADR-0002\b[^\n]*\s+Verdict: (APPROVE WITH CONDITIONS|APPROVE|INCONCLUSIVE|BLOCK)\s+Report: docs/reviews/ADR-0002-audit[\s\S]*Clauses:[\s\S]*Findings:[\s\S]*Fix first:[\s\S]*Next:'
  - name: production-code-untouched-write
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*[\\/]+cwd[\\/]+ledger[\\/]+(api|transfers|accounts|reports|auth|db)\.py"'
    min: 0
    max: 0
  - name: production-code-untouched-edit
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"[^"]*[\\/]+cwd[\\/]+ledger[\\/]+(api|transfers|accounts|reports|auth|db)\.py"'
    min: 0
    max: 0
